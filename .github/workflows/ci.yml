name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Suite de ataques
        run: python -m evals.run_evals --report evals/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-report
          path: evals/REPORT.md
